# yaml-language-server: $schema=./harness.config.schema.json
# Lemony — harness configuration.
# Generated by `lemony install`. Safe to edit; `install` refuses to overwrite
# this file — use `repair` to re-sync at the pinned version, or `update` to change
# the pinned version. The `$schema` header above
# gives an IDE (VS Code YAML extension) autocomplete + inline validation from the
# committed `harness.config.schema.json` the installer drops next to this file.

# Vendor catalog version this instance is pinned to (exact pin during the pilot).
vendor_version: 0.11.0

# AI-coding harness this install targets. Only `claude-code` is operative today.
target: claude-code

# Where managed tasks live. Auth is delegated to the `gh` CLI (no token here).
task_storage:
  type: github
  repo: Lemoncode/prueba-harness

# Playbook paths — deprecated: both keys are read only by the old playbook
# hooks, and 0.12.0 removes the hooks and the keys. Move the playbooks into
# Claude Code rules, client skills and reference docs with `/import <dir>/` in a
# Claude Code session instead of setting them; `lemony doctor` warns on a value
# other than the default. Defaults shown.
# paths:
#   # The project's playbook directory (repo-relative).
#   playbooks: docs/playbooks
#   # The global playbook layer, which nothing replaces (absolute or `~`-based).
#   playbooks_global: ~/.claude/playbooks

# Rollback snapshots. Each `update` bundles the pre-update vendor tree under
# `.claude/.harness/snapshots/<from-version>/` (gitignored); `rollback` restores it.
rollback:
  # How many snapshot bundles to retain (rotation drops the oldest). A positive
  # integer or `unlimited` (never rotate). Default 3.
  keep_snapshots: 3

# Anonymous usage telemetry — ON by default. At session close the harness sends an
# anonymized, identifier-free projection of local events to improve the tool.
# Three ways to opt out (highest precedence first):
#   1. env `LEMONY_TELEMETRY_DISABLED=1` (this shell/machine),
#   2. `lemony telemetry disable` (this checkout only, not committed),
#   3. the committed switch below (the whole team, for this repo).
# Uncomment to opt the team out:
# telemetry:
#   enabled: false

# Agent-executed merges. Before the agent runs any `gh pr merge` (an authorized
# task-PR merge, or the closeout record PR), the shared executor
# `.claude/hooks/lib/merge-pr.sh` verifies the check status the platform reports
# for the PR and only merges on green — red, absent, or still-pending checks are
# surfaced to a human instead. Defaults shown — declare only overrides.
# merge:
#   # Max seconds to wait for pending checks before surfacing instead of merging.
#   checks_timeout_secs: 600
#   # Standing answer for a repo with no CI: `true` lets the executor merge when
#   # the platform reports no checks at all (otherwise it asks, every time).
#   allow_no_checks: false

# Implementation-phase knobs the Orchestrator reads at the L1 approval gate.
# auto_commit — does the agent commit automatically as it works? `on`: the
# Implementer commits and pushes as it goes; `off`: zero commits — the work
# accumulates in the worktree, you review it UNCOMMITTED (Source Control) and
# the branch gets its first commit on your OK (more control). `human` (default)
# asks at the gate, in the same interaction as the all-at-once / step-by-step
# choice, recommending OFF; `on` / `off` pin the answer and skip the question
# (a headless/bench run must pin `on`). Bare on/off are strings here (YAML 1.2).
# Replaces `pre_commit_review` (0.3.0, inverse polarity): the old key is
# tolerated and removed on the next config write; its value is not migrated.
# implementation:
#   auto_commit: human

# Review gates. The mechanical gates a Reviewer must attest in its evidence
# ledger, one entry per name, beyond the always-required real run — a flat list of
# this project's script names (`package.json` scripts, or your CI's equivalents).
# Declare every gate your CI enforces, drift checks included: an undeclared project
# reviews against a floor of the real run only (honest, but thin). The agent may
# propose this list from your manifest at the approval gate — confirmed by a human
# and added by hand (this block is the shape); no tool writes it for you.
# gates:
#   - lint
#   - test
#   - build

# Design tokens (the `design-tokens` verbs, and the token lines of `doctor` / `status`).
# `scan_extensions`: the anti-hardcode scan inspects a built-in set of UI/style
# extensions (.css/.scss/.ts/.tsx/.vue/.svelte/.astro/.js/.mdx/.html/…). Add extra
# suffixes here for a stack the built-ins don't cover — additive, never a replacement.
# Default none.
# `verify`: a command line `design-tokens contrast` runs alongside its own WCAG checks
# (through `sh -c`, in the repo root) — your design system's own verifier for the rules
# only it can know (palette under colour-vision-deficiency simulation, property grammar,
# CSS scans). Its output is forwarded; a non-zero exit fails the gate. It runs on every
# path: with no token file only the WCAG pair check is skipped, and a file
# that cannot be read or parsed is reported alongside it — never the verifier you
# declared. Default none.
# `file`: where the token file lives, relative to the repository root — for a DTCG
# file kept (or generated) somewhere other than docs/design-tokens.json. Every
# design-tokens verb, `doctor` and `status` read it from here. An absolute path, a `\`
# separator, a path that leads out of the repository or names its root, or one ending
# in `/` or `/.` is a config error. Default docs/design-tokens.json.
# `scan_exclude`: files or directories, relative to the repository root, the
# anti-hardcode scan leaves out — for generated output you commit. Output git ignores
# is already left out. Each skipped path is named in the scan's output; a directory you
# name explicitly with `--scan` is still scanned. An absolute
# path, a `\` separator, or a path that leads out of the repository or names its root
# is a config error. Default none.
# design_tokens:
#   scan_extensions:
#     - .foo
#   verify: pnpm exec my-design-system verify
#   file: design/tokens.json
#   scan_exclude:
#     - src/design/
